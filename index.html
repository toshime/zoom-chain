<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ズーム遷移プロト — Zoom Chain</title>
<meta name="description" content="ピンチイン／ピンチアウトで異なるイラスト間を遷移するギミックのプロトタイプ。カエル → タコ → イカ と、寄って引くたびに周りの世界が入れ替わる。">
<meta name="theme-color" content="#f0f0ee">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="ズーム遷移プロト — Zoom Chain">
<meta property="og:description" content="寄ると別の生き物になっている。ピンチで遷移する連鎖ズームのプロトタイプ。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f0f0ee'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231a1a1a' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='6' ry='2' fill='%231a1a1a'/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; position:fixed; inset:0;
    overscroll-behavior:none; background:#f0f0ee;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* 初回だけ出る操作ヒント。UIを増やさないよう数秒で消える */
  .hint {
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px);
    transform:translateX(-50%); pointer-events:none; white-space:nowrap;
    font:12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.12em;
    color:#1a1a1a; mix-blend-mode:multiply; opacity:.55;
    animation:hintOut 1.2s ease 6s forwards;
  }
  @keyframes hintOut { to { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .hint { animation-delay:3s; } }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div class="hint" id="hint">ハエに寄る</div>

<script>
// ═══════════════════════════════════════════════════════════
//  ズーム遷移ギミック プロト / 白黒・手描きスケッチ
//
//  連鎖：カエルの目 → タコの目 →（ハエ移動）→ タコの吸盤
//        → イカの吸盤 →（ハエ移動）→ イカの別の吸盤
//        → カエルの指の吸盤 →（ハエ移動）→ カエルの目 …
//
//  ・ハエの止まっている箇所＝次にズームインする箇所（ワールド原点）
//  ・切り替わりが確定したら、引いたタイミングでハエが飛び、着地で固定
// ═══════════════════════════════════════════════════════════

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));

// ── チューニング定数 ───────────────────────────────────────
// 倍率の上下限は「壁」ではなく数値が壊れないための保険。表示UIが無いので広く取ってある
const MIN_ZOOM=-3.2, MAX_ZOOM=8.5;
const SWAP_HI  = 4.35;   // ここまで寄ると入れ替わり確定
const FADE_W   = 0.8;    // クロスフェードにかける zoom 幅
const MOVE_OUT = 0.75;   // ここまで引くとハエが次の場所へ飛ぶ
const MOVE_WAIT= 0.7;    // 引いてから飛び立つまでの間

const swapLo = SWAP_HI - FADE_W;
const fit   = () => Math.min(W,H)/1150;
const scale = () => Math.pow(2, zoom) * fit();
let PX = 1;                                  // 画面1px = 何ワールドユニットか

let zoom=0, camX=0, camY=0;
// ホイールは離散イベントなので、目標倍率へ指数的に補間してなめらかに寄せる
let zoomTarget=0, smoothAX=0, smoothAY=0, smoothTau=0.14;
const toScreen=(x,y)=>[W/2+(x-camX)*scale(), H/2+(y-camY)*scale()];
const toWorld =(x,y)=>[camX+(x-W/2)/scale(), camY+(y-H/2)/scale()];

// カメラの移動範囲は制限しない。絵の外まで自由に出られる方が触っていて気持ちがいい
function setZoom(z, sx, sy){        // (sx,sy) の下のワールド点を固定したまま倍率を変える
  const [wx,wy]=toWorld(sx,sy);
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
  const [ax,ay]=toWorld(sx,sy);
  camX += wx-ax; camY += wy-ay;
}
function zoomAt(f, sx, sy){         // ピンチ：指に1:1で追従させる（補間を挟むと遅れて気持ち悪い）
  setZoom(zoom+Math.log2(f), sx, sy);
  zoomTarget = zoom;
}
function easeZoom(dt){              // ホイール：目標倍率へフレームレート非依存で寄せる
  const d = zoomTarget - zoom;
  if(Math.abs(d) < 0.0005){ zoom = zoomTarget; return; }
  setZoom(zoom + d*(1-Math.exp(-dt/smoothTau)), smoothAX, smoothAY);
}

// ── 入力（Pointer Events で自前ピンチ）──────────────────────
const pts=new Map(); let prevDist=0, prevCx=0, prevCy=0;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){prevCx=e.clientX; prevCy=e.clientY;}
  prevDist=0;
});
cv.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const L=[...pts.values()];
  if(L.length>=2){
    const [a,b]=L, dist=Math.hypot(a.x-b.x,a.y-b.y);
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    if(prevDist>0){
      camX-=(cx-prevCx)/scale(); camY-=(cy-prevCy)/scale();
      zoomAt(dist/prevDist, cx, cy);
    }
    prevDist=dist; prevCx=cx; prevCy=cy;
  } else {
    camX-=(e.clientX-prevCx)/scale(); camY-=(e.clientY-prevCy)/scale();
    prevCx=e.clientX; prevCy=e.clientY;
  }
});
function release(e){
  pts.delete(e.pointerId); prevDist=0;
  const r=[...pts.values()]; if(r.length===1){prevCx=r[0].x; prevCy=r[0].y;}
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  // deltaMode: 0=px, 1=行, 2=ページ。Firefox は行単位で来るので正規化する
  const dy = e.deltaY * (e.deltaMode===1 ? 16 : e.deltaMode===2 ? H : 1);
  smoothTau = e.ctrlKey ? 0.05 : 0.15;   // トラックパッドのピンチは元々連続なので短めに
  smoothAX = e.clientX; smoothAY = e.clientY;
  zoomTarget = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM,
                 zoomTarget - dy*(e.ctrlKey ? 0.012 : 0.0042)));
},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>
  cv.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('dblclick', e=>e.preventDefault());

// ── 手描き線のヘルパ ───────────────────────────────────────
const INK='#1a1a1a';
// 種から決まる固定ノイズ。毎フレーム乱数を振ると線が沸くので必ず固定する
function n(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return (x-Math.floor(x))*2-1; }

function roughEll(cx,cy,rx,ry,rot,seed,amp){
  amp=amp||0.055; rot=rot||0;
  const N=26, c=Math.cos(rot), s=Math.sin(rot);
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2, k=1+n(seed+i*3.1)*amp;
    const x=Math.cos(a)*rx*k, y=Math.sin(a)*ry*k;
    const px=cx+x*c-y*s, py=cy+x*s+y*c;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function roughArm(x1,y1,cx,cy,x2,y2,w,seed){
  const path=[], N=15;
  for(let i=0;i<=N;i++){
    const t=i/N, mt=1-t;
    const x=mt*mt*x1+2*mt*t*cx+t*t*x2, y=mt*mt*y1+2*mt*t*cy+t*t*y2;
    const dx=2*mt*(cx-x1)+2*t*(x2-cx), dy=2*mt*(cy-y1)+2*t*(y2-cy);
    const L=Math.hypot(dx,dy)||1;
    const hw=w*(1-t*0.5)*(1+n(seed+i)*0.09);
    path.push([x-dy/L*hw, y+dx/L*hw, x+dy/L*hw, y-dx/L*hw]);
  }
  ctx.beginPath();
  path.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  for(let i=path.length-1;i>=0;i--) ctx.lineTo(path[i][2], path[i][3]);
  ctx.closePath();
}
// 塗り → クリップしてハッチング → インク輪郭。ext はハッチの走査範囲（描画量に直結）
function ink(pathFn, wash, ang, spacing, seed, lw, ext){
  pathFn(); ctx.fillStyle=wash; ctx.fill();
  if(spacing){
    const R=ext||420;
    ctx.save(); pathFn(); ctx.clip();
    ctx.strokeStyle='rgba(26,26,26,.24)'; ctx.lineWidth=1.6*PX; ctx.lineCap='round';
    const c=Math.cos(ang), s=Math.sin(ang);
    for(let d=-R; d<=R; d+=spacing){
      const j=n(seed+d*0.07)*spacing*0.3;
      ctx.beginPath();
      ctx.moveTo(-R*c-(d+j)*s, -R*s+(d+j)*c);
      ctx.lineTo( R*c-(d-j)*s,  R*s+(d-j)*c);
      ctx.stroke();
    }
    ctx.restore();
  }
  pathFn(); ctx.strokeStyle=INK; ctx.lineWidth=(lw||2.6)*PX;
  ctx.lineJoin='round'; ctx.stroke();
}
function at(x,y,fn){ ctx.save(); ctx.translate(x,y); fn(); ctx.restore(); }

// ── アンカーになる特徴（すべて半径58・同じ明度帯に揃える）─────
function featFrogEye(){                       // カエルの目
  ink(()=>roughEll(0,0,58,56,0,11), '#f2f2f2', -0.5, 13, 21, 3.2, 70);
  ink(()=>roughEll(0,0,37,36,0,31), '#c0c0c0',  0.8,  8, 41, 2.4, 45);
  ink(()=>roughEll(0,0,30,9,0,51),  '#1a1a1a',  0,    0, 61, 2.2);   // 横長の瞳孔
  ctx.fillStyle='#fbfbfb'; roughEll(-19,-21,10,8,0,71); ctx.fill();
}
function featOctoEye(){                       // タコの目（カエルとほぼ同じ構造）
  ink(()=>roughEll(0,0,58,56,0,14), '#eeeeee',  0.4, 13, 24, 3.2, 70);
  ink(()=>roughEll(0,0,38,35,0,34), '#bcbcbc', -1.0,  8, 44, 2.4, 45);
  ctx.fillStyle='#1a1a1a';                                          // 長方形の瞳孔
  roughEll(0,0,31,8,0,54,0.03); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=2.2*PX; ctx.stroke();
  ctx.strokeStyle='rgba(26,26,26,.45)'; ctx.lineWidth=3*PX;         // まぶたの皺
  ctx.beginPath(); ctx.moveTo(-56,-30); ctx.quadraticCurveTo(0,-52,56,-26); ctx.stroke();
  ctx.fillStyle='#fbfbfb'; roughEll(-20,-20,9,7,0,74); ctx.fill();
}
function featOctoSucker(){                    // タコの吸盤
  ink(()=>roughEll(0,0,58,57,0,12), '#eaeaea', 0.6, 12, 22, 3.2, 70);
  ink(()=>roughEll(0,0,42,41,0,32), '#c6c6c6', 2.1,  8, 42, 2.4, 50);
  ink(()=>roughEll(0,0,24,23,0,52), '#4c4c4c', 0,    0, 62, 2.2);
  ctx.fillStyle='#fbfbfb'; roughEll(-20,-22,12,9,0,72); ctx.fill();
}
function featSquidSucker(){                   // イカの吸盤（角質環）
  ink(()=>roughEll(0,0,58,57,0,13), '#ececec', -0.9, 12, 23, 3.2, 70);
  ink(()=>roughEll(0,0,42,41,0,33), '#c2c2c2',  1.4,  8, 43, 2.4, 50);
  ctx.beginPath();
  for(let i=0;i<22;i++){
    const a=i/22*Math.PI*2, r=(i%2?26:37)*(1+n(90+i)*0.09);
    const x=Math.cos(a)*r, y=Math.sin(a)*r;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.fillStyle='#3d3d3d'; ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=2.2*PX; ctx.stroke();
  ctx.fillStyle='#fbfbfb'; roughEll(-19,-21,11,8,0,73); ctx.fill();
}
function featFrogToe(){                       // カエルの指の吸盤（趾間板）
  ink(()=>roughEll(0,0,58,55,0,15), '#e8e8e8', 1.1, 12, 25, 3.2, 70);
  ink(()=>roughEll(0,2,41,38,0,35), '#cacaca', -0.3, 9, 45, 2.4, 50);
  ctx.strokeStyle='rgba(26,26,26,.5)'; ctx.lineWidth=2.4*PX;        // 同心の畝
  for(let i=1;i<=3;i++){ roughEll(0,3,10+i*8, 9+i*7,0,55+i*4); ctx.stroke(); }
  ctx.fillStyle='#5a5a5a'; roughEll(0,4,11,10,0,75); ctx.fill();
  ctx.fillStyle='#fbfbfb'; roughEll(-20,-20,11,8,0,85); ctx.fill();
}
// 小さい方の吸盤（アンカーでないもの）
function smallSucker(r, dark, seed){
  ink(()=>roughEll(0,0,r,r*0.97,0,seed), '#e6e6e6', 0.6, r/4, seed+3, 2.2, r+10);
  ink(()=>roughEll(0,0,r*0.46,r*0.44,0,seed+7), dark, 0, 0, seed+9, 2);
}

// ── 生き物（ローカル座標。anchors がワールド原点に来る）────────
function drawFrog(){
  // 前脚と指
  ink(()=>roughArm(-230,110,-330,240,-425,352,58,701), '#d4d4d4', 0.5, 22, 706, 2.6, 300);
  ink(()=>roughArm(-425,352,-470,372,-500,400,34,711), '#d4d4d4', 0.5, 16, 716, 2.4, 90);
  ink(()=>roughArm(-420,358,-445,450,-432,500,30,721), '#d4d4d4', 0.5, 16, 726, 2.4, 110);
  ink(()=>roughArm(-412,362,-378,470,-332,518,28,731), '#d4d4d4', 0.5, 16, 736, 2.4, 120);
  // 後脚・胴・頭
  ink(()=>roughEll(300,420,178,96,-0.45,101), '#d2d2d2', 0.4, 22, 111, 2.6, 220);
  ink(()=>roughEll(0,150,335,245,0,121),      '#dcdcdc', -0.6, 26, 131, 2.6, 400);
  ink(()=>roughEll(0,-110,300,198,0,141),     '#e4e4e4',  0.9, 24, 151, 2.6, 360);
  // 斑点と口
  ctx.strokeStyle='rgba(26,26,26,.42)'; ctx.lineWidth=3*PX; ctx.lineCap='round';
  [[110,190,52,33],[-90,270,40,26],[210,60,33,21],[30,320,28,18]].forEach((s,i)=>{
    roughEll(s[0],s[1],s[2],s[3],0,161+i*7); ctx.stroke(); });
  ctx.strokeStyle=INK; ctx.lineWidth=5*PX;
  ctx.beginPath(); ctx.moveTo(-190,-30); ctx.quadraticCurveTo(0,72,175,-38); ctx.stroke();
  // 目の隆起 → 目
  ink(()=>roughEll(-165,-250,95,88,0,171), '#e4e4e4', 0.2, 20, 181, 2.6, 110);
  ink(()=>roughEll(160,-262,95,88,0,191),  '#e4e4e4', 0.2, 20, 201, 2.6, 110);
  at(-165,-250, featFrogEye);
  at( 160,-262, featFrogEye);
  // 指先の吸盤
  at(-432,500, ()=>smallSucker(44,'#5a5a5a',241));
  at(-332,518, ()=>smallSucker(41,'#5a5a5a',251));
  at(-500,400, featFrogToe);                                  // ← anchor: toe
}

function drawOcto(){
  [[-120,-200,-350,150,-480,520,60,301],
   [ -40,-190, -80,200,  60,600,54,311],
   [  60,-200, 320, 60, 620,300,48,321]].forEach(a=>
    ink(()=>roughArm(a[0],a[1],a[2],a[3],a[4],a[5],a[6],a[7]), '#d6d6d6', 0.7, 20, a[7]+5, 2.6, 420));
  ink(()=>roughArm(-20,-190,100,120,470,470,88,331), '#e0e0e0', 1.1, 18, 336, 2.6, 400);
  ink(()=>roughEll(0,-420,255,300,0.08,341), '#d8d8d8', -0.4, 26, 351, 2.6, 330);
  ctx.strokeStyle='rgba(26,26,26,.32)'; ctx.lineWidth=3*PX;
  [[-60,-560,110,58,0.2],[80,-330,70,42,-0.3],[-140,-240,55,32,0.4]].forEach((s,i)=>{
    roughEll(s[0],s[1],s[2],s[3],s[4],391+i*9); ctx.stroke(); });
  ink(()=>roughEll(150,-430,42,36,0,371), '#eeeeee', 0, 0, 376, 2.4);   // 反対側の目
  ctx.fillStyle='#1a1a1a'; roughEll(150,-430,22,7,0,381); ctx.fill();
  at( 60,-30, ()=>smallSucker(40,'#4c4c4c',261));
  at(150, 90, ()=>smallSucker(45,'#4c4c4c',271));
  at(330,330, ()=>smallSucker(43,'#4c4c4c',281));
  at(-165,-430, featOctoEye);                                 // ← anchor: eye
  at( 225, 210, featOctoSucker);                              // ← anchor: sucker
}

function drawSquid(){
  ink(()=>roughEll(-190,-880,150,105,0.5,541), '#d0d0d0', 0.5, 20, 551, 2.6, 170);
  ink(()=>roughEll( -10,-870,150,105,-0.5,561),'#d0d0d0', -0.5, 20, 571, 2.6, 170);
  [[-200,-380,-300,  0,-380,480,44,501],
   [-100,-370, -60,100, 100,620,40,511],
   [   0,-380, 260,-60, 600,240,38,521]].forEach(a=>
    ink(()=>roughArm(a[0],a[1],a[2],a[3],a[4],a[5],a[6],a[7]), '#dadada', -0.8, 20, a[7]+5, 2.6, 420));
  ink(()=>roughArm(-60,-360,60,60,520,500,80,531), '#e2e2e2', 1.5, 18, 536, 2.6, 420);
  ink(()=>roughEll(-100,-620,180,340,0.06,581), '#dbdbdb', 1.2, 24, 591, 2.6, 360);
  ctx.strokeStyle='rgba(26,26,26,.3)'; ctx.lineWidth=3*PX;
  for(let i=0;i<4;i++){ ctx.beginPath();
    ctx.moveTo(-190+i*44,-840); ctx.quadraticCurveTo(-175+i*44,-660,-160+i*40,-460); ctx.stroke(); }
  ink(()=>roughEll(-150,-390,46,40,0,601), '#f2f2f2', 0, 0, 611, 2.4);
  ctx.fillStyle='#1a1a1a'; roughEll(-150,-390,21,20,0,621); ctx.fill();
  at(145, 65, ()=>smallSucker(45,'#3d3d3d',291));
  at(345,300, ()=>smallSucker(43,'#3d3d3d',295));
  at(240,195, featSquidSucker);                               // ← anchor: sucker
  at(475,456, featSquidSucker);                               // ← anchor: sucker2
}

const CREATURES=[
  { draw:drawFrog,  anchors:{ eye:[160,-262],  toe:[-500,400] } },
  { draw:drawOcto,  anchors:{ eye:[-165,-430], sucker:[225,210] } },
  { draw:drawSquid, anchors:{ sucker:[240,195], sucker2:[475,456] } },
];

// land = その生き物に切り替わった瞬間にハエが居る特徴
// zoom = ハエが移動したあと、次にズームインする特徴
const CHAIN=[
  { c:0, land:'toe',    zoom:'eye'     },  // カエル：指の吸盤に着地 → 目へ
  { c:1, land:'eye',    zoom:'sucker'  },  // タコ  ：目に着地      → 吸盤へ
  { c:2, land:'sucker', zoom:'sucker2' },  // イカ  ：吸盤に着地    → 別の吸盤へ
];

// ── 状態 ───────────────────────────────────────────────────
let node=0, activeAnchor='eye', armed=true, blend=0;
let pendingAnchor=null, moveWait=0;
const PAPER='#f0f0ee';
const smoothstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t);};

function reanchor(name){
  const cr=CREATURES[CHAIN[node].c];
  const A1=cr.anchors[activeAnchor], A2=cr.anchors[name];
  const dx=A1[0]-A2[0], dy=A1[1]-A2[1];           // ワールド全体が (A1-A2) ずれる
  camX+=dx; camY+=dy;
  fly.x+=dx; fly.y+=dy; fly.fx+=dx; fly.fy+=dy; fly.tx+=dx; fly.ty+=dy;
  activeAnchor=name;
}
function updateStage(){
  const t=smoothstep(swapLo, SWAP_HI, zoom);
  if(armed && t>=0.999){
    node=(node+1)%CHAIN.length;
    activeAnchor=CHAIN[node].land;               // B は既にこの基準で描かれているので継ぎ目なし
    armed=false; moveWait=MOVE_WAIT;
  }
  blend = armed ? t : 0;
}

// ── ハエ：切り替わったら1回だけ飛んで、そこに固定 ───────────────
const fly={x:0,y:0,fx:0,fy:0,tx:0,ty:0,t:1,dur:1,arc:0};
const easeIO=t=> t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function flyHop(tx,ty){
  fly.fx=fly.x; fly.fy=fly.y; fly.tx=tx; fly.ty=ty; fly.t=0;
  fly.dur=Math.max(0.9, Math.min(2.2, 0.7+Math.hypot(tx-fly.fx,ty-fly.fy)/700));
  fly.arc=(Math.random()<0.5?-1:1)*(0.12+Math.random()*0.2);
}
function flyUpdate(dt){
  if(fly.t<1){
    fly.t=Math.min(1, fly.t+dt/fly.dur);
    const e=easeIO(fly.t), dx=fly.tx-fly.fx, dy=fly.ty-fly.fy;
    const bow=Math.sin(e*Math.PI)*fly.arc;
    fly.x=fly.fx+dx*e-dy*bow; fly.y=fly.fy+dy*e+dx*bow;
    if(pts.size===0){                            // 飛んでいる間はカメラが緩く追う
      camX+=(fly.x-camX)*0.05; camY+=(fly.y-camY)*0.05;
    }
    if(fly.t>=1 && pendingAnchor){ reanchor(pendingAnchor); pendingAnchor=null; armed=true; }
    return;
  }
  if(!armed && !pendingAnchor && zoom<MOVE_OUT){  // 引いたら次の場所へ飛び立つ
    moveWait-=dt;
    if(moveWait<=0){
      const cr=CREATURES[CHAIN[node].c];
      const A1=cr.anchors[activeAnchor], A2=cr.anchors[CHAIN[node].zoom];
      flyHop(A2[0]-A1[0], A2[1]-A1[1]);
      pendingAnchor=CHAIN[node].zoom;
    }
  }
}
function drawFly(t){
  const flying=fly.t<1;
  // 入れ替わり中と「引け」の催促中は激しく羽ばたく
  const agit=Math.max(blend, (!armed && !pendingAnchor && zoom>=MOVE_OUT) ? 0.85 : 0);
  const amp=(flying?10:7)+agit*40, spd=1+agit*2.6;
  const jx=Math.sin(t*2.3*spd)*amp+Math.sin(t*5.7*spd)*amp*0.35;
  const jy=Math.cos(t*1.9*spd)*amp*0.8+Math.cos(t*6.4*spd)*amp*0.3;
  const [px,py]=toScreen(fly.x, fly.y);
  const s=Math.max(13, Math.min(54, 14+zoom*8.2));

  ctx.save();
  ctx.translate(px+jx, py+jy);
  ctx.rotate((flying?Math.atan2(fly.ty-fly.fy, fly.tx-fly.fx)*0.5:0)+Math.sin(t*2.1*spd)*0.3);
  ctx.scale(s/22, s/22);
  const keep=PX; PX=1;                            // ハエは画面座標で描く
  const wing=Math.abs(Math.sin(t*(flying?46:28)));
  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.strokeStyle='rgba(26,26,26,.5)'; ctx.lineWidth=1;
  roughEll(-2,-9-wing*4,13,5+wing*2.5,-0.55,801); ctx.fill(); ctx.stroke();
  roughEll(-2, 9+wing*4,13,5+wing*2.5, 0.55,811); ctx.fill(); ctx.stroke();
  ink(()=>roughEll(0,0,14,8.5,0,821), '#2a2a2a', 0.9, 4, 831, 1.6, 18);
  ink(()=>roughEll(-12,0,7,6.5,0,841), '#3a3a3a', 0, 0, 851, 1.4);
  ctx.fillStyle='#1a1a1a';
  roughEll(-16,-3,3.5,3,0,861); ctx.fill();
  roughEll(-16, 3,3.5,3,0,871); ctx.fill();
  PX=keep;
  ctx.restore();
}

// ── 紙目 ───────────────────────────────────────────────────
const tile=document.createElement('canvas'); tile.width=tile.height=180;
(()=>{ const c=tile.getContext('2d'), im=c.createImageData(180,180);
  for(let i=0;i<180*180;i++){ const v=234+Math.random()*21;
    im.data[i*4]=v; im.data[i*4+1]=v; im.data[i*4+2]=v-2; im.data[i*4+3]=255; }
  c.putImageData(im,0,0);
})();
const grain=ctx.createPattern(tile,'repeat');

// ── 描画 ───────────────────────────────────────────────────
function paint(nodeIdx, anchorName, alpha){
  const cr=CREATURES[CHAIN[nodeIdx].c], a=cr.anchors[anchorName];
  ctx.globalAlpha=alpha;
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
  ctx.save();
  const s=scale();
  ctx.translate(W/2-camX*s, H/2-camY*s); ctx.scale(s,s);
  ctx.translate(-a[0], -a[1]);
  cr.draw();
  ctx.restore();
  ctx.globalAlpha=1;
}

const el=id=>document.getElementById(id);
let last=0;

function frame(ms){
  const t=ms/1000, dt=Math.min(0.05, last?t-last:0.016); last=t;
  easeZoom(dt); updateStage(); flyUpdate(dt);
  PX = 1/scale();

  paint(node, activeAnchor, 1);                   // A は不透明
  if(blend>0.001){                                // B を alpha=blend で重ねる（濁らない合成）
    const nx=(node+1)%CHAIN.length;
    paint(nx, CHAIN[nx].land, blend);
  }

  ctx.save();
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.5;
  ctx.fillStyle=grain; ctx.fillRect(0,0,W,H);
  ctx.restore();

  drawFly(t);

  requestAnimationFrame(frame);
}

// 初期状態：カエル、ハエは右目に固定
(function init(){
  const a=CREATURES[0].anchors.eye;
  camX=0-a[0]; camY=80-a[1];                      // 体の中心あたりを画面中央に
  el('hint').textContent =
    matchMedia('(pointer: coarse)').matches ? 'ピンチでハエに寄る' : 'ホイールでハエに寄る';
  resize();
  smoothAX=W/2; smoothAY=H/2; zoomTarget=zoom;
  requestAnimationFrame(frame);
})();
</script>
