<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zoom</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:title" content="zoom">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%231a1a1a' stroke-width='2'/%3E%3Cellipse cx='16' cy='16' rx='6' ry='2' fill='%231a1a1a'/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; position:fixed; inset:0;
    overscroll-behavior:none; background:#fff;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* 開始後だけ出る操作ヒント。UIを増やさないよう数秒で消える */
  .hint {
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px);
    transform:translateX(-50%); pointer-events:none; white-space:nowrap;
    font:12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.12em;
    color:#1a1a1a; mix-blend-mode:multiply; opacity:0;
  }
  .hint.go { animation:hintCycle 7.4s ease forwards; }
  @keyframes hintCycle { 0%{opacity:0} 8%{opacity:.55} 80%{opacity:.55} 100%{opacity:0} }

  /* タイトル */
  .start {
    position:fixed; inset:0; z-index:10; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#dcdcdc; color:#1a1a1a;
    -webkit-tap-highlight-color:transparent;
    transition:opacity .6s ease;
  }
  .start.off { opacity:0; pointer-events:none; }
  .go, .note {
    font:12px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:.2em; white-space:nowrap;
  }
  .go { font-size:14px; }
  .go { animation:breathe 2.6s ease-in-out infinite; }
  .note { margin-top:15px; font-size:11px; letter-spacing:.16em; opacity:.42; }
  @keyframes breathe { 0%,100%{opacity:.85} 50%{opacity:.38} }
  @media (prefers-reduced-motion: reduce) {
    .go { animation:none; opacity:.85; }
  }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div class="hint" id="hint">ハエに寄る</div>
<div class="start" id="start" role="button" tabindex="0" aria-label="クリックしてスタート">
  <div class="go">クリックしてスタート</div>
  <div class="note">音が出ます</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  ズーム遷移ギミック / シーンは scenes/flow.json から読む
//
//  連鎖は editor.html で編集する。各シーン画像は正方形領域を2つ持つ：
//    zoom … ここへ寄り切ると次のシーンへ（＝ハエの止まり場所）
//    land … 前のシーンの zoom が、この位置・大きさで重なって現れる
//
//  ・ハエの止まっている箇所＝次にズームインする箇所（ワールド原点）
//  ・切り替わりが確定したら、引いたタイミングでハエが飛び、着地で固定
// ═══════════════════════════════════════════════════════════

const cv = document.getElementById('cv');
const view = cv.getContext('2d');            // 画面に出す最終合成先
// 絵はすべてオフスクリーンに描く。周辺視野のぼかしで同じ絵を2回使うため
const off = document.createElement('canvas');
const ctx = off.getContext('2d');
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  off.width = cv.width; off.height = cv.height;
  view.setTransform(DPR,0,0,DPR,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);         // 幅を代入すると状態が飛ぶので毎回置き直す
  buildPeriph();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
// レイアウト前（clientWidth=0）に起動すると resize イベントが来ず復帰できないので監視しておく
if(window.ResizeObserver) new ResizeObserver(resize).observe(cv);

// ── チューニング定数 ───────────────────────────────────────
// 倍率の上下限は「壁」ではなく数値が壊れないための保険。表示UIが無いので広く取ってある
const MIN_ZOOM=-3.2, MAX_ZOOM=8.5;
const SWAP_HI  = 3.4;    // ここまで寄ると入れ替わり確定。下げるほど浅い寄りで入れ替わる（ゆるい）
const FADE_W   = 0.8;    // クロスフェードにかける zoom 幅
const MOVE_OUT = 0.75;   // ここまで引くとハエが次の場所へ飛ぶ
const MOVE_WAIT= 0.7;    // 引いてから飛び立つまでの間

// 周辺視野ぼかし
const PERIPH     = true; // 切るとオフスクリーンをそのまま出すだけになる
const PERIPH_MAX = 24;   // 最も強いところのぼけ半径（画面px）
const PERIPH_R0  = 0.18; // ここまでは素通し（画面中心〜対角半径に対する比）

// 中央の当たり枠（画面座標に固定するUI。ズームしても大きさは変わらない）
const FRAME_ON   = true;
const FRAME_N    = 4;    // スプライトシートのコマ数（横並び）
const FRAME_FPS  = 8;    // コマ送りの速さ
const FRAME_SIZE = 0.94; // 一辺の長さ（画面短辺に対する比）。正方形のまま短辺いっぱいに寄せる
const FRAME_INK  = 0.8;  // 濃さ

const swapLo = SWAP_HI - FADE_W;
const fit   = () => Math.min(W,H)/1150;
const scale = () => Math.pow(2, zoom) * fit();
let PX = 1;                                  // 画面1px = 何ワールドユニットか

let zoom=0, camX=0, camY=0;
// ホイールは離散イベントなので、目標倍率へ指数的に補間してなめらかに寄せる
let zoomTarget=0, smoothAX=0, smoothAY=0, smoothTau=0.14;
const toScreen=(x,y)=>[W/2+(x-camX)*scale(), H/2+(y-camY)*scale()];
const toWorld =(x,y)=>[camX+(x-W/2)/scale(), camY+(y-H/2)/scale()];

// カメラの移動範囲は制限しない。絵の外まで自由に出られる方が触っていて気持ちがいい
function setZoom(z, sx, sy){        // (sx,sy) の下のワールド点を固定したまま倍率を変える
  const [wx,wy]=toWorld(sx,sy);
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
  const [ax,ay]=toWorld(sx,sy);
  camX += wx-ax; camY += wy-ay;
}
function zoomAt(f, sx, sy){         // ピンチ：指に1:1で追従させる（補間を挟むと遅れて気持ち悪い）
  setZoom(zoom+Math.log2(f), sx, sy);
  zoomTarget = zoom;
}
function easeZoom(dt){              // ホイール：目標倍率へフレームレート非依存で寄せる
  const d = zoomTarget - zoom;
  if(Math.abs(d) < 0.0005){ zoom = zoomTarget; return; }
  setZoom(zoom + d*(1-Math.exp(-dt/smoothTau)), smoothAX, smoothAY);
}

// ── 入力（Pointer Events で自前ピンチ）──────────────────────
const pts=new Map(); let prevDist=0, prevCx=0, prevCy=0;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){prevCx=e.clientX; prevCy=e.clientY;}
  prevDist=0;
});
cv.addEventListener('pointermove', e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const L=[...pts.values()];
  if(L.length>=2){
    const [a,b]=L, dist=Math.hypot(a.x-b.x,a.y-b.y);
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    if(prevDist>0){
      camX-=(cx-prevCx)/scale(); camY-=(cy-prevCy)/scale();
      zoomAt(dist/prevDist, cx, cy);
    }
    prevDist=dist; prevCx=cx; prevCy=cy;
  } else {
    camX-=(e.clientX-prevCx)/scale(); camY-=(e.clientY-prevCy)/scale();
    prevCx=e.clientX; prevCy=e.clientY;
  }
});
function release(e){
  pts.delete(e.pointerId); prevDist=0;
  const r=[...pts.values()]; if(r.length===1){prevCx=r[0].x; prevCy=r[0].y;}
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  // deltaMode: 0=px, 1=行, 2=ページ。Firefox は行単位で来るので正規化する
  const dy = e.deltaY * (e.deltaMode===1 ? 16 : e.deltaMode===2 ? H : 1);
  smoothTau = e.ctrlKey ? 0.05 : 0.15;   // トラックパッドのピンチは元々連続なので短めに
  smoothAX = e.clientX; smoothAY = e.clientY;
  zoomTarget = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM,
                 zoomTarget - dy*(e.ctrlKey ? 0.012 : 0.0042)));
},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>
  cv.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('dblclick', e=>e.preventDefault());

// ── ダイヤル音 ─────────────────────────────────────────────
//  log2 の zoom 軸を等間隔の「刻み」に切って、またぐたびに1回鳴らす。
//  log2 なので刻みはどの倍率でも体感的に等間隔になる（3章の理由がそのまま効く）。
//  速く動かすほど1フレームで大量の刻みをまたぐので、勝手に「ギュリリリリ」になる。
//  ホイールの指数減衰で止まるときは刻みの間隔が開くので、減速もそのまま音になる。
const CLICK_STEP  = 0.16;   // 刻み幅（log2）。小さいほど密に鳴る
const CLICK_GAP   = 0.018;  // 連射の下限間隔（秒）。これより速くは詰めない
const CLICK_AHEAD = 0.14;   // 先読みの上限（秒）。これ以上は溜めずに間引く
const CLICK_REF   = -0.5;   // このズームで原音のピッチになる。下げると全体が高くなる
const CLICK_OCT   = 0.34;   // zoom 1 あたり何オクターブ上がるか
const CLICK_VOL   = 0.42;

let AC=null, clickBuf=null, clickOut=null, lastNotch=null, nextAt=0, clickSeed=0, prevZoomA=null;

// ── BGM と切り替わり音 ─────────────────────────────────────
//  BGMはシーンごとに1曲（null は無音）。シーンが替わると前の曲と
//  クロスフェードで「ぬるっ」と入れ替わる。
//  正解（ハエの居る特徴＝ワールド原点）へ寄るほど BGM を絞る。
const BGM_VOL   = 0.5;    // 通常音量
const BGM_DUCK  = 0.15;   // 寄り切ったときに残る音量（BGM_VOL に対する倍率）
const BGM_XFADE = 1.8;    // 入れ替えフェードの長さ（秒）
const SWAP_VOL  = 0.9;    // 切り替わり音の音量

// シーン番号（0始まり）→ 曲。1:タイトル と 10:コーヒー は無音、11:宇宙 は夢オチ曲
const SCENE_BGM = [null,'bgm01','bgm02','bgm03','bgm04','bgm05','bgm06','bgm07','bgm08',null,'bgm_room'];
// 切り替わり音は「入る先のシーン」で選ぶ。11:宇宙 は専用、6〜9（ループ帯）は専用
const swapSfxFor = idx => idx===10 ? 'swap_space' : (idx>=5 && idx<=8) ? 'swap_loop' : 'swap';

const SFX_FILES=['swap','swap_loop','swap_space',
                 'bgm01','bgm02','bgm03','bgm04','bgm05','bgm06','bgm07','bgm08','bgm_room'];
let audioBufs={};                          // 名前 → AudioBuffer（読み込み済みのものだけ入る）
let bgmBus=null, bgmPlaying=null, bgmVolNow=BGM_VOL;   // bgmPlaying: {name, src, gain}

function loadBuf(url, set){
  fetch(url).then(r=>r.arrayBuffer())
    // Safari は Promise を返さない旧シグネチャなのでコールバック版で受ける
    .then(b=>new Promise((ok,ng)=>AC.decodeAudioData(b,ok,ng)))
    .then(set)
    .catch(()=>{});                        // 鳴らなくても遊べる。握り潰す
}

function initAudio(){
  if(AC) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C();
  clickOut=AC.createGain(); clickOut.gain.value=CLICK_VOL; clickOut.connect(AC.destination);
  bgmBus=AC.createGain(); bgmBus.gain.value=BGM_VOL; bgmBus.connect(AC.destination);
  loadBuf('dial.mp3', b=>{ clickBuf=b; });
  SFX_FILES.forEach(f=> loadBuf(f+'.mp3', b=>{ audioBufs[f]=b; }));
}

// シーン切り替わりの瞬間：入る先のシーンに応じた SFX を1発鳴らす。
// BGM の入れ替えは bgmUpdate が node を見て勝手にやる
function sceneSwapAudio(idx){
  if(!AC || AC.state!=='running') return;
  const b=audioBufs[swapSfxFor(idx)];
  if(!b) return;
  const s=AC.createBufferSource(); s.buffer=b;
  const g=AC.createGain(); g.gain.value=SWAP_VOL;
  s.connect(g); g.connect(AC.destination); s.start();
}

function bgmUpdate(dt){
  if(!AC || AC.state!=='running' || !started) return;
  // いま流れているべき曲（シーンから決まる）と実際が違えばクロスフェードで入れ替える。
  // バッファ未着ならその曲が来るまで待つ（前の曲は流れ続ける）
  const want=(SCENES && SCENE_BGM[node]) || null;
  const cur=bgmPlaying ? bgmPlaying.name : null;
  if(want!==cur && (want===null || audioBufs[want])){
    const now=AC.currentTime;
    if(bgmPlaying){
      const g=bgmPlaying.gain.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(0, now+BGM_XFADE);
      bgmPlaying.src.stop(now+BGM_XFADE+0.1);
      bgmPlaying=null;
    }
    if(want){
      const s=AC.createBufferSource(); s.buffer=audioBufs[want]; s.loop=true;
      const g=AC.createGain();
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(1, now+BGM_XFADE);
      s.connect(g); g.connect(bgmBus); s.start(now);
      bgmPlaying={name:want, src:s, gain:g};
    }
  }
  // 「正解に近い」＝ 深く寄っていて、かつ狙いの特徴が画面中央付近にあること
  const d=Math.hypot(camX,camY)*scale();                    // 原点の画面中心からのズレ（画面px）
  const near=1-Math.min(1, d/(Math.min(W,H)*0.6));
  const deep=smoothstep(1.0, SWAP_HI, zoom);
  const prox=near*deep;
  const target=BGM_VOL*(1-(1-BGM_DUCK)*prox);
  // 急に絞ると耳につくので毎フレーム指数的に寄せる
  bgmVolNow += (target-bgmVolNow)*(1-Math.exp(-dt/0.12));
  bgmBus.gain.value=bgmVolNow;
}
// 音は必ずユーザー操作から起こす（モバイルは自動再生できない）
function unlockAudio(){
  initAudio();
  if(!AC) return;
  if(AC.state!=='running') AC.resume();       // iOS は 'interrupted' も来るので !== running で見る
  // iOS Safari は resume() だけだと起きないことがある。
  // ジェスチャの中で一度でも音源を鳴らすと確実に開くので、無音を1サンプル流しておく
  if(!AC.__kicked){
    AC.__kicked=true;
    const s=AC.createBufferSource();
    s.buffer=AC.createBuffer(1,1,AC.sampleRate);
    s.connect(AC.destination); s.start(0);
  }
}
['pointerdown','touchstart','wheel','keydown'].forEach(t=>
  window.addEventListener(t, unlockAudio, {passive:true}));
// バックグラウンドから戻ると suspended のままになることがある
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && AC && AC.state!=='running') AC.resume();
});

function playClick(at, z, dir, speed){
  const s=AC.createBufferSource(); s.buffer=clickBuf;
  const w=n(clickSeed++);                  // 種から決まる揺らぎ。毎回同じ音だと機械的に聞こえる
  s.playbackRate.value=Math.max(0.5, Math.min(4.8,
    Math.pow(2, (z-CLICK_REF)*CLICK_OCT + dir*0.05 + w*0.03)));
  const g=AC.createGain();
  g.gain.value=(0.55+Math.min(1,speed/40)*0.45)*(1+w*0.12);  // 速いほど少し強く
  s.connect(g); g.connect(clickOut); s.start(at);
}

function clickAudio(dt){
  if(!AC || AC.state!=='running' || !clickBuf){ lastNotch=null; prevZoomA=null; return; }
  const speed=prevZoomA===null ? 0 : Math.abs(zoom-prevZoomA)/Math.max(dt,1e-3);  // zoom単位/秒
  prevZoomA=zoom;
  const notch=Math.floor(zoom/CLICK_STEP);
  if(lastNotch===null){ lastNotch=notch; return; }            // 鳴り始めは基準を取るだけ
  if(notch===lastNotch) return;
  const from=lastNotch, dir=notch>from?1:-1, count=Math.abs(notch-from);
  lastNotch=notch;
  const now=AC.currentTime;
  if(nextAt<now) nextAt=now;
  // 溜めすぎると指から音が遅れるので、鳴らせる数だけに間引く。
  // 打ち切りではなく間引きなのは、最後の刻みまで鳴らしてピッチを現在倍率に着地させたいから
  const room=Math.max(1, Math.floor((now+CLICK_AHEAD-nextAt)/CLICK_GAP)+1);
  const play=Math.min(count, room);
  for(let i=0;i<play;i++){
    // 刻みごとの倍率でピッチを決めるので、速い一振りが上昇/下降のグリッサンドになる
    const k=Math.round((i+1)*count/play);
    playClick(nextAt, (from+k*dir)*CLICK_STEP, dir, speed);
    nextAt+=CLICK_GAP;
  }
}

// ── 手描き線のヘルパ ───────────────────────────────────────
const INK='#1a1a1a';
// 種から決まる固定ノイズ。毎フレーム乱数を振ると線が沸くので必ず固定する
function n(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return (x-Math.floor(x))*2-1; }

function roughEll(cx,cy,rx,ry,rot,seed,amp){
  amp=amp||0.055; rot=rot||0;
  const N=26, c=Math.cos(rot), s=Math.sin(rot);
  ctx.beginPath();
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2, k=1+n(seed+i*3.1)*amp;
    const x=Math.cos(a)*rx*k, y=Math.sin(a)*ry*k;
    const px=cx+x*c-y*s, py=cy+x*s+y*c;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
// 塗り → クリップしてハッチング → インク輪郭。ext はハッチの走査範囲（描画量に直結）
function ink(pathFn, wash, ang, spacing, seed, lw, ext){
  pathFn(); ctx.fillStyle=wash; ctx.fill();
  if(spacing){
    const R=ext||420;
    ctx.save(); pathFn(); ctx.clip();
    ctx.strokeStyle='rgba(26,26,26,.24)'; ctx.lineWidth=1.6*PX; ctx.lineCap='round';
    const c=Math.cos(ang), s=Math.sin(ang);
    for(let d=-R; d<=R; d+=spacing){
      const j=n(seed+d*0.07)*spacing*0.3;
      ctx.beginPath();
      ctx.moveTo(-R*c-(d+j)*s, -R*s+(d+j)*c);
      ctx.lineTo( R*c-(d-j)*s,  R*s+(d-j)*c);
      ctx.stroke();
    }
    ctx.restore();
  }
  pathFn(); ctx.strokeStyle=INK; ctx.lineWidth=(lw||2.6)*PX;
  ctx.lineJoin='round'; ctx.stroke();
}
// ── シーン（scenes/flow.json）───────────────────────────────
//  ワールド座標は「いまのアンカー領域の中心が原点・半径 R0」になるように取る。
//  R0 を旧ハードコード版の特徴半径と同じ値にしてあるので、
//  SWAP_HI / MOVE_OUT / BGM の寄り判定などの調整値がそのまま効く。
const R0 = 58;
let SCENES = null;                 // 読み込み完了で [{img,w,h,land,zoom}] になる
let fitPending = false;            // 画面寸法が取れてから初期倍率を合わせるための保留

const fallbackRegion = s => ({ x:s.w/2, y:s.h/2, r:Math.min(s.w,s.h)*0.18 });
// name は 'zoom' か 'land'。1枚だけの flow でも落ちないよう中央に保険の領域を置く
const regionOf = (i,name) => SCENES[i][name] || fallbackRegion(SCENES[i]);

fetch('scenes/flow.json', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(flow=>Promise.all((flow.scenes||[]).map(fs=>new Promise((ok,ng)=>{
    const img=new Image();
    img.onload =()=>ok({ img, w:img.naturalWidth, h:img.naturalHeight,
                         land:fs.land||null, zoom:fs.zoom||null });
    img.onerror=()=>ng(new Error(fs.file));
    // flow.json 側が NFD（macOS の濁点分解）でも Pages の実体（NFC）に当たるよう揃える
    img.src='scenes/'+encodeURIComponent(fs.file.normalize ? fs.file.normalize('NFC') : fs.file);
  }))))
  .then(list=>{ if(!list.length) throw new Error('empty'); SCENES=list; initScene(); })
  .catch(()=>{     // file:// 直開きや flow 未作成。遊べないことだけタイトルに出す
    const g=document.querySelector('.go');
    if(g) g.textContent='scenes/flow.json が読めない';
  });

// ── 状態 ───────────────────────────────────────────────────
//  activeAnchor：いまワールド原点に据えている領域。'zoom'＝次への判定、'land'＝着地点
let node=0, activeAnchor='zoom', armed=false, blend=0;
let pendingAnchor=false, moveWait=0;
const PAPER='#ffffff';
const smoothstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t);};
const hasNext=()=>!!(SCENES && node+1<SCENES.length && SCENES[node].zoom);

function initScene(){
  node=0;
  activeAnchor = SCENES[0].zoom ? 'zoom' : 'land';
  armed = hasNext();                             // 最初からハエは判定の上に居る
  const sc=SCENES[0], a=regionOf(0,activeAnchor), k=R0/a.r;
  camX=(sc.w/2-a.x)*k; camY=(sc.h/2-a.y)*k;      // 絵の中心を画面中央に
  fly.x=fly.fx=fly.tx=0; fly.y=fly.fy=fly.ty=0; fly.t=1;
  fitScene();
}
function fitScene(){                             // 絵全体が収まる倍率から始める
  if(!W || !H){ fitPending=true; return; }
  fitPending=false;
  const sc=SCENES[node], a=regionOf(node,activeAnchor), k=R0/a.r;
  zoom=Math.max(MIN_ZOOM, Math.log2(Math.min(W/(sc.w*k), H/(sc.h*k))*0.92/fit()));
  zoomTarget=zoom;
}

// ハエが land から zoom へ移ったら、ワールドの基準も zoom 領域へ据え替える。
// 領域の半径が違うとワールドの縮尺ごと変わるので、zoom 値を同じだけずらして
// 画面上の見た目は1pxも動かさない
function reanchor(){
  const A1=regionOf(node,activeAnchor), A2=SCENES[node].zoom;
  const k1=R0/A1.r, k2=R0/A2.r;
  const mx=x=>(x/k1+(A1.x-A2.x))*k2, my=y=>(y/k1+(A1.y-A2.y))*k2;
  camX=mx(camX); camY=my(camY);
  fly.x=mx(fly.x); fly.y=my(fly.y);
  fly.fx=mx(fly.fx); fly.fy=my(fly.fy);
  fly.tx=mx(fly.tx); fly.ty=my(fly.ty);
  const dz=Math.log2(k2/k1);
  zoom-=dz; zoomTarget-=dz;
  lastNotch=null; prevZoomA=null;                // ダイヤル音の基準も取り直す（据え替えで鳴らさない）
  activeAnchor='zoom';
}
function updateStage(){
  if(!SCENES) return;
  const t=(armed && hasNext()) ? smoothstep(swapLo, SWAP_HI, zoom) : 0;
  if(armed && t>=0.999){
    node++;
    activeAnchor='land';                         // B は既にこの基準で描かれているので継ぎ目なし
    armed=false; moveWait=MOVE_WAIT;
    sceneSwapAudio();                            // 切り替わり音 ＋ BGM 入れ替え
  }
  blend = armed ? t : 0;
}

// ── ハエ：切り替わったら1回だけ飛んで、そこに固定 ───────────────
const fly={x:0,y:0,fx:0,fy:0,tx:0,ty:0,t:1,dur:1,arc:0};
const easeIO=t=> t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function flyHop(tx,ty){
  fly.fx=fly.x; fly.fy=fly.y; fly.tx=tx; fly.ty=ty; fly.t=0;
  fly.dur=Math.max(0.9, Math.min(2.2, 0.7+Math.hypot(tx-fly.fx,ty-fly.fy)/700));
  fly.arc=(Math.random()<0.5?-1:1)*(0.12+Math.random()*0.2);
}
function flyUpdate(dt){
  if(fly.t<1){
    fly.t=Math.min(1, fly.t+dt/fly.dur);
    const e=easeIO(fly.t), dx=fly.tx-fly.fx, dy=fly.ty-fly.fy;
    const bow=Math.sin(e*Math.PI)*fly.arc;
    fly.x=fly.fx+dx*e-dy*bow; fly.y=fly.fy+dy*e+dx*bow;
    // カメラは追従させない。視点の主導権は常にプレイヤー側にある
    if(fly.t>=1 && pendingAnchor){ pendingAnchor=false; reanchor(); armed=true; }
    return;
  }
  if(!armed && !pendingAnchor && hasNext() && zoom<MOVE_OUT){  // 引いたら次の場所へ飛び立つ
    moveWait-=dt;
    if(moveWait<=0){
      const A1=regionOf(node,activeAnchor), A2=SCENES[node].zoom, k=R0/A1.r;
      flyHop((A2.x-A1.x)*k, (A2.y-A1.y)*k);
      pendingAnchor=true;
    }
  }
}
// ハエのスプライト（hae1/hae2 の2コマを交互に出して羽ばたきにする）
const HAE=[new Image(), new Image()]; let haeReady=false;
{ let n=0; ['hae1.png','hae2.png'].forEach((src,i)=>{
    HAE[i].onload=()=>{ if(++n===2) haeReady=true; };
    HAE[i].src=src;
  }); }

function drawFly(t){
  const flying=fly.t<1;
  // 入れ替わり中と「引け」の催促中は激しく羽ばたく
  const agit=Math.max(blend, (!armed && !pendingAnchor && hasNext() && zoom>=MOVE_OUT) ? 0.85 : 0);
  // 止まり際も判定の周りをノイズっぽく漂う（乱数でなく非整数比の正弦の重ね）
  // サイズも振れ幅も画面短辺比で取る（固定pxだと大画面ほどハエが小さく・狭く見える）
  const u=Math.min(W,H)/800;
  const amp=((flying?10:48)+agit*40)*u, spd=1+agit*2.6;
  const jx=(Math.sin(t*2.3*spd)*0.70+Math.sin(t*5.7*spd)*0.35+Math.sin(t*11.3*spd)*0.15)*amp;
  const jy=(Math.cos(t*1.9*spd)*0.55+Math.cos(t*6.4*spd)*0.30+Math.cos(t*12.7*spd)*0.15)*amp;
  const [px,py]=toScreen(fly.x, fly.y);
  const s=Math.max(9, Math.min(30, 10+zoom*5.5))*u;  // 従来の半分・画面短辺800px基準

  ctx.save();
  ctx.translate(px+jx, py+jy);
  ctx.rotate((flying?Math.atan2(fly.ty-fly.fy, fly.tx-fly.fx)*0.5:0)+Math.sin(t*2.1*spd)*0.3);
  if(haeReady){
    const img=HAE[((t*(flying?24:14)*spd)|0)%2];    // gifっぽい2コマ切り替え
    const w=s*1.7, h=w*(139/137);
    ctx.drawImage(img, -w/2, -h/2, w, h);
  }else{                                            // 画像が来るまでの保険（旧・手描きハエ）
    ctx.scale(s/22, s/22);
    const keep=PX; PX=1;                            // ハエは画面座標で描く
    const wing=Math.abs(Math.sin(t*(flying?46:28)));
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.strokeStyle='rgba(26,26,26,.5)'; ctx.lineWidth=1;
    roughEll(-2,-9-wing*4,13,5+wing*2.5,-0.55,801); ctx.fill(); ctx.stroke();
    roughEll(-2, 9+wing*4,13,5+wing*2.5, 0.55,811); ctx.fill(); ctx.stroke();
    ink(()=>roughEll(0,0,14,8.5,0,821), '#2a2a2a', 0.9, 4, 831, 1.6, 18);
    ink(()=>roughEll(-12,0,7,6.5,0,841), '#3a3a3a', 0, 0, 851, 1.4);
    ctx.fillStyle='#1a1a1a';
    roughEll(-16,-3,3.5,3,0,861); ctx.fill();
    roughEll(-16, 3,3.5,3,0,871); ctx.fill();
    PX=keep;
  }
  ctx.restore();
}

// ── 紙目 ───────────────────────────────────────────────────
const tile=document.createElement('canvas'); tile.width=tile.height=180;
(()=>{ const c=tile.getContext('2d'), im=c.createImageData(180,180);
  for(let i=0;i<180*180;i++){ const v=234+Math.random()*21;
    im.data[i*4]=v; im.data[i*4+1]=v; im.data[i*4+2]=v-2; im.data[i*4+3]=255; }
  c.putImageData(im,0,0);
})();
const grain=ctx.createPattern(tile,'repeat');

// ── 周辺視野ぼかし ─────────────────────────────────────────
//  中心は素通し、外へ向かうほどぼける。
//
//  off ─縮小─> wsrc ─blur─> blurCv ─放射グラデーションで抜く─> view
//
//  縮小してから処理するのは負荷対策。どうせぼけるので解像度は要らない。
const CAN_FILTER=(()=>{                        // Safari 17 未満などは ctx.filter が無い
  const c=document.createElement('canvas').getContext('2d');
  c.filter='blur(2px)'; return c.filter==='blur(2px)';
})();
// 縮小率は「デバイス画素」に対する比。CSS px 基準にすると高DPRの端末ほど粗くなる（DPR2で実質0.19倍＝5.26倍拡大）。
// 0.5 はちょうど 1/2 なので縮小も拡大も端数が出ず、リサンプルが一番きれいに乗る（0.65 より 0.5 の方が誤差が小さい）
const DS = CAN_FILTER ? 0.5 : 0.07;            // filter が無い環境は縮小拡大のボケだけで代用する

const mkCv=()=>document.createElement('canvas');
const wsrcCv=mkCv(), blurCv=mkCv();
const wctx=wsrcCv.getContext('2d'), bctx=blurCv.getContext('2d');
let bw=0, bh=0, bpad=0, brad=0, bmask=null;

// 効きのカーブ。線形だと効き始めが帯に見え、t^2 だと中間がほぼ素通しになる
const PERIPH_STOPS=[[0,0],[0.25,0.22],[0.5,0.58],[0.75,0.88],[1,1]];

function buildPeriph(){
  if(!PERIPH || !W || !H) return;
  bw=Math.max(1,Math.round(off.width*DS)); bh=Math.max(1,Math.round(off.height*DS));
  brad=PERIPH_MAX*DPR*DS;                      // PERIPH_MAX は画面px なのでバッファのpxへ換算する
  // ぼかしはキャンバス外を透明として拾うので、縁が欠けないぶんの余白を取る
  bpad=CAN_FILTER ? Math.ceil(brad*2 + 2) : 2;
  const pw=bw+bpad*2, ph=bh+bpad*2;
  [wsrcCv,blurCv].forEach(c=>{ c.width=pw; c.height=ph; });
  const cx=bpad+bw/2, cy=bpad+bh/2, half=Math.hypot(bw,bh)/2;
  const g=bctx.createRadialGradient(cx,cy,half*PERIPH_R0, cx,cy,half);
  PERIPH_STOPS.forEach(s=> g.addColorStop(s[0],'rgba(0,0,0,'+s[1]+')'));
  bmask=g;
}

// ── 中央の当たり枠 ─────────────────────────────────────────
//  手描き枠の4コマを 8fps でループさせるだけ。線がぷるぷるして紙の上に留まる。
//  ワールドではなく画面座標に固定するので、寄っても引いても枠の大きさは変わらない。
//  「この枠にいい感じに収まったら」の基準にする当たり枠。
const frameImg=new Image();
let fsw=0, fsh=0;                                       // 1コマぶんのサイズ
frameImg.onload=()=>{ fsw=frameImg.naturalWidth/FRAME_N; fsh=frameImg.naturalHeight; };
frameImg.src='frame_sheet.png';

function drawFrame(t){
  if(!FRAME_ON || !started || !fsw) return;             // タイトル中は出さない
  const w=Math.min(W,H)*FRAME_SIZE, h=w*fsh/fsw;
  const i=Math.floor(t*FRAME_FPS)%FRAME_N;
  view.save();
  view.globalCompositeOperation='multiply';             // 紙に刷った見た目に寄せる
  view.globalAlpha=FRAME_INK;
  view.drawImage(frameImg, i*fsw,0, fsw,fsh, (W-w)/2, (H-h)/2, w, h);
  view.restore();
}

function present(t){
  if(!W || !H) return;                                  // レイアウト前は描くものが無い
  view.drawImage(off, 0,0, W,H);                        // まず鮮明な絵をそのまま
  if(PERIPH && bmask){
    const pw=blurCv.width, ph=blurCv.height;
    // 1) 縮小。ぼかしが縁で欠けないよう、引き伸ばし下地 → 正位置 の2回描きで余白を埋める
    wctx.setTransform(1,0,0,1,0,0);
    wctx.drawImage(off, 0,0, pw,ph);                    // 下地は外周リングにしか出ない
    wctx.drawImage(off, bpad,bpad, bw,bh);
    // 2) ぼかし
    bctx.setTransform(1,0,0,1,0,0);
    bctx.globalCompositeOperation='source-over';
    bctx.clearRect(0,0,pw,ph);
    if(CAN_FILTER) bctx.filter='blur('+brad+'px)';
    bctx.drawImage(wsrcCv, 0,0);
    bctx.filter='none';
    // 3) グラデーションで抜いて、鮮明な絵の上に重ねる
    bctx.globalCompositeOperation='destination-in';
    bctx.fillStyle=bmask; bctx.fillRect(0,0,pw,ph);
    bctx.globalCompositeOperation='source-over';
    view.drawImage(blurCv, bpad,bpad, bw,bh, 0,0, W,H);
  }
  drawFrame(t);                                         // 枠はぼかしの外。中央なので常に鮮明
  // 紙目はぼかしの外側＝全面に等倍で乗せる。紙そのものはボケない
  // （2枚の絵が「同じ1枚の紙の上の出来事」に見える条件なので、ここは崩さない）
  view.save();
  view.globalCompositeOperation='multiply'; view.globalAlpha=0.5;
  view.fillStyle=grain; view.fillRect(0,0,W,H);
  view.restore();
}

// ── 描画 ───────────────────────────────────────────────────
function paint(idx, anchorName, alpha){
  const sc=SCENES[idx], a=regionOf(idx, anchorName), k=R0/a.r;  // k = ワールド / 画像px
  ctx.globalAlpha=alpha;
  // 最後のシーンだけ宇宙なので黒地。クロスフェードで黒ごとぬるっと入る
  ctx.fillStyle = idx===SCENES.length-1 ? '#000' : PAPER;
  ctx.fillRect(0,0,W,H);
  ctx.save();
  const s=scale();
  ctx.translate(W/2-camX*s, H/2-camY*s); ctx.scale(s*k, s*k);
  ctx.translate(-a.x, -a.y);
  ctx.drawImage(sc.img, 0, 0);
  ctx.restore();
  ctx.globalAlpha=1;
}

const el=id=>document.getElementById(id);
let last=0;

function frame(ms){
  const t=ms/1000, dt=Math.min(0.05, last?t-last:0.016); last=t;
  easeZoom(dt); clickAudio(dt); bgmUpdate(dt); updateStage(); flyUpdate(dt);
  PX = 1/scale();

  if(SCENES){
    if(fitPending) fitScene();
    paint(node, activeAnchor, 1);                 // A は不透明
    if(blend>0.001 && node+1<SCENES.length)       // B を alpha=blend で重ねる（濁らない合成）
      paint(node+1, 'land', blend);
    if(node>0 && node<SCENES.length-1) drawFly(t);  // タイトルと最後の宇宙にはハエは居ない
  }else{
    ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);   // 読み込みが終わるまでは紙だけ
  }

  present(t);    // オフスクリーン → 画面（周辺だけぼかす）。枠と紙目はこの中で最後に乗る

  requestAnimationFrame(frame);
}

// ── タイトル ───────────────────────────────────────────────
//  絵は裏で回したままタイトルを被せておき、外すと同時にゲームが始まる。
//  ここが唯一確実な「ユーザー操作」なので、音のアンロックもこの1回に賭ける。
let started=false;
function startGame(){
  if(started) return;
  started=true;
  unlockAudio();
  const s=el('start');
  s.classList.add('off');
  el('hint').classList.add('go');
  setTimeout(()=>{ s.style.display='none'; }, 700);   // 透明でも重なっていると邪魔なので外す
}
el('start').addEventListener('pointerdown', startGame);
el('start').addEventListener('click', startGame);     // pointerdown が来ない経路の保険
el('start').addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); startGame(); }
});

// 初期状態：flow.json 待ち。カメラとハエは読み込み完了時に initScene() が据える
(function init(){
  el('hint').textContent =
    matchMedia('(pointer: coarse)').matches ? 'ピンチでハエに寄る' : 'ホイールでハエに寄る';
  resize();
  smoothAX=W/2; smoothAY=H/2; zoomTarget=zoom;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
